# Render Blueprint for the API (free plan). In the Render dashboard:
# New → Blueprint → pick this repo. Values marked `sync: false` are asked for
# once in the dashboard and never stored in git.
services:
  - type: web
    name: fehlerfreund-api
    runtime: node
    plan: free
    rootDir: server
    # Dev dependencies (TypeScript) are needed for the build step.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # No GPU or memory for a model on the free plan: the model runs on the
      # developer's machine and is reached through ollama-gateway + a tunnel
      # (see ollama-gateway/README.md).
      - key: LLM_MODE
        value: ollama
      - key: OLLAMA_MODEL
        value: gemma3:4b
      # The tunnel's public URL, e.g. https://something.ngrok-free.app
      - key: OLLAMA_URL
        sync: false
      # Same value as GATEWAY_TOKEN on the machine running the gateway.
      - key: OLLAMA_API_KEY
        sync: false
      # Vercel rewrite + Render's own proxy.
      - key: TRUST_PROXY
        value: "2"
      # Render's free plan blocks outgoing SMTP, so emails (password reset)
      # go through Brevo's HTTP API. MAIL_FROM must be a sender verified in
      # Brevo, e.g. "Fehlerfreund <you@gmail.com>".
      - key: EMAIL_MODE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # Shared secret for the n8n reminder workflow (n8n/README.md). Copy the
      # generated value into the n8n "Fehlerfreund API key" credential.
      - key: REMINDER_API_KEY
        generateValue: true
